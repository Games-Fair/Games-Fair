# SPDX-License-Identifier: AGPL-3.0-only WITH App-Fair-Distribution-Exception
#
# Games Fair's CI: build every target the app declares, and run its walkthrough in every
# language it ships (https://daybrite.dev/docs/ci). The shared Day workflow does the work.
#
# It runs on a push and on a pull request. The App Fair queue rebuilds the app from a tag
# when it publishes, so there is nothing for a timer to catch.
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  # Marking a staged release Latest (see `release-mode` below) rebuilds the site against it.
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: write # release assets on a tag build
  pages: write    # web-dom → GitHub Pages (deploy-web)
  id-token: write # deploy-pages OIDC token (deploy-web)

jobs:
  # The catalog's rules: the licence texts, the licence notice in every source file, and the
  # flavor manifest holding the ids this app publishes under. The submission checks run the same
  # action (github.com/appfair/appfair-apps).
  appfair-lint:
    name: appfair-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: appfair/appfair-apps/.github/actions/appfair-lint@main

  app:
    uses: daybrite/actions/.github/workflows/dayapp.yml@main
    secrets: inherit
    with:
      # The targets this app was scaffolded with. Add one with `day project add-target`, and
      # add it here too.
      targets: "windows-xaml, macos-appkit, linux-gtk, linux-qt, ios-uikit, android-mdc, harmony-arkui, web-dom"
      day-version: main
      # The walkthroughs beside the app: the navigation sweep, every game's screenshots, and the
      # two games whose input needs its own script.
      scripts: dayscript/smoke.yaml dayscript/games.yaml dayscript/reversi.yaml dayscript/pipes.yaml
      # Pins every game's RNG, so a scripted run meets the same puzzle and layout everywhere.
      launch-env: DAY_GAMES_SEED=15
      # Every language the app ships, read from resource/locales/, so a language added to the app
      # is walked through without editing this file. Each locale captures its own screenshots.
      #locales: all
      locales: en fr
      themes: light dark
      # Android captures on a 9:16 phone rather than the default 20:9 one: Google Play takes a
      # screenshot whose long side is at most twice its short, and the listing's screenshots
      # are these captures. The tablet is the default: captured halved (1280x800) and scaled
      # up x2 by `day store stage` for Play's tablet slots.
      android-devices: |
        device=pixel,          os=36, orientation=portrait,  slug=phone
        device=medium_tablet,  os=36, orientation=landscape, slug=tablet
        device=medium_phone,   os=24, optional=true
      # On a tag, the App Fair identity (Day-appfair.toml) gets a leg per target: that is the
      # build the publishing queue rebuilds, and a break under those ids (HarmonyOS refuses a
      # hyphen in a bundle name, for one) shows up here first. An ordinary push builds the base
      # app alone, and appfair-lint checks the flavor's ids on every one. Release assets, Pages
      # and the store uploads stay with the base build, which the queue compares against.
      flavors: ${{ startsWith(github.ref, 'refs/tags/v') && 'appfair' || '' }}
      # A tagged build attaches its packages to the release. The App Fair queue compares its
      # own build against these, so leave them on.
      release-assets: true
      # A tag publishes a pre-release: the packages are downloadable by tag, and
      # releases/latest, the download links on the site and everything else that reads "the
      # latest release" keep describing the version before it. Marking the release Latest, which
      # the App Fair's queue also does once it has attached its signed packages, fires the
      # `release: released` event above and rebuilds the site against the new version.
      release-mode: pre-release
      # website/site.toml makes the workflow build and deploy the full project site
      # (https://games-fair.github.io/Games-Fair/) from the daybrite/daysite template on every
      # push to main, with the web build hosted at /Games-Fair/webapp/. deploy-web stays on as
      # the fallback: were website/ ever removed, the bare web app would return to the Pages root.
      deploy-web: true
      # The App Fair Project signs and submits through its catalog
      # (https://github.com/appfair/appfair-apps), so this workflow uploads to no store.
      upload-ios: "false"
      upload-macos: "false"
      upload-play: "false"
