    it:
      subtitle: "Classici senza pubblicità"
      short: "Dieci classici: carte, rompicapi e arcade. Offline e senza pubblicità."
      description: |-
        Dieci giochi classici in un’unica app. Gioca offline, senza pubblicità, acquisti o account. Le partite si salvano automaticamente, così puoi riprenderle in seguito.

        SOLITARIO — Klondike con pesca di una o tre carte, suggerimenti e un’opzione per distribuzioni verificate come risolvibili.
        BLOCK BLAST — Posiziona i blocchi, completa righe e colonne e crea combo.
        BREAKOUT — Fai rimbalzare la pallina, rompi i mattoni e raccogli potenziamenti.
        SIRTET — Ruota i blocchi in caduta e completa le linee mentre il ritmo aumenta.
        SUDOKU — Scegli la difficoltà, prendi appunti, usa suggerimenti e salva punti di controllo.
        2048 — Scorri e unisci tessere uguali. Continua anche dopo aver raggiunto 2048.
        MIMI — Indovina con gli amici usando mazzi tematici. Usa i pulsanti o, sui dispositivi compatibili, i controlli di inclinazione.
        CAMPO MINATO — Scopri le caselle sicure e segna le mine. La prima mossa è sempre sicura.
        REVERSI — Capovolgi le pedine avversarie. Sfida il computer o un amico sullo stesso dispositivo.
        TUBI — Ruota i tubi per collegare tutta la rete.

        Menu, istruzioni ed etichette di accessibilità in 13 lingue. Mimi include mazzi tradotti su animali e cibo; la raccolta inglese offre altri temi.

        App open source, realizzata con il framework Day e l’interfaccia nativa di ogni piattaforma. Codice: github.com/Games-Fair/Games-Fair
      keywords: ["solitario", "sudoku", "2048", "sciarade", "campo minato", "reversi", "tubi", "blocchi", "carte", "arcade", "offline"]
      release-notes: |-
        Dieci giochi in un'unica app: Solitario, Block Blast, Breakout, blocchi che cadono, Sudoku, 2048,
        Campo minato, Mimi, Reversi e Tubi.

        Ogni schermata è disegnata con i controlli nativi della piattaforma. Le partite si salvano e si
        ripristinano da sole, anche a metà turno, e tutta l'app funziona offline, senza pubblicità, senza
        acquisti e senza account.
      promo: "Solitario, Sudoku, 2048, Mimi e altro: dieci giochi con salvataggio dei progressi, senza pubblicità né acquisti."
    ja:
      subtitle: "広告なしの定番ゲーム集"
      short: "カード、パズル、アーケードなど10種類の定番ゲーム。オフライン対応、広告なし。"
      description: |-
        10種類の定番ゲームをひとつのアプリで。広告、購入、アカウント登録なしでオフラインでも遊べます。進行状況は自動保存され、いつでも続きを楽しめます。

        ソリティア — 1枚引きと3枚引きに対応したクロンダイク。ヒント機能と、解けることを検証した配札だけを選ぶ設定があります。
        BLOCK BLAST — ブロックを置いて行や列をそろえ、コンボをつなげましょう。
        BREAKOUT — ボールを跳ね返してレンガを壊し、パワーアップを集めましょう。
        SIRTET — 落ちてくるブロックを回転させて列を消します。徐々にスピードが上がります。
        数独 — 難易度を選び、メモやヒント、チェックポイントを活用できます。
        2048 — 同じ数字のタイルをスライドして合体。2048達成後も続けられます。
        ジェスチャーゲーム — テーマ別のお題を友達と当てましょう。ボタン操作のほか、対応端末では傾き操作も使えます。
        マインスイーパー — 安全なマスを開き、地雷に旗を立てます。最初の一手は必ず安全です。
        リバーシ — 相手の石を裏返しましょう。コンピューター対戦と、1台の端末での友達との対戦に対応。
        パイプ — パイプを回転させて、ネットワーク全体をつなげましょう。

        メニュー、遊び方、アクセシビリティ用ラベルは13言語に対応。ジェスチャーゲームには翻訳済みの動物と食べ物のお題があり、英語版にはさらに多くのテーマがあります。

        Dayフレームワークと各プラットフォームのネイティブUIで作られたオープンソースアプリです。ソースコード：github.com/Games-Fair/Games-Fair
      keywords: ["ソリティア", "数独", "2048", "ジェスチャー", "マインスイーパー", "リバーシ", "パイプ", "ブロック", "カード", "パズル", "オフライン"]
      release-notes: |-
        10種類のゲームをひとつのアプリで。ソリティア、Block Blast、Breakout、落ちものブロック、数独、2048、マインスイーパー、ジェスチャーゲーム、リバーシ、パイプ。

        画面はすべて各プラットフォーム標準のUI部品で描いています。ゲームは途中でも自動で保存・再開され、アプリ全体がオフラインで動作します。広告も、購入も、アカウントもありません。
      promo: "ソリティア、数独、2048、ジェスチャーゲームなど10種類をひとつのアプリに。進行状況を自動保存。広告もアプリ内購入もありません。"
    ko:
      subtitle: "광고 없는 클래식 게임"
      short: "카드, 퍼즐, 아케이드 등 클래식 게임 10종. 광고 없이 오프라인으로 즐기세요."
      description: |-
        클래식 게임 10종을 하나의 앱에 담았습니다. 광고, 구매, 계정 없이 오프라인으로 플레이하세요. 게임이 자동으로 저장되어 나중에 이어서 즐길 수 있습니다.

        솔리테어 — 한 장 또는 세 장씩 뽑는 클론다이크. 힌트와 해결 가능 여부를 검증한 패만 사용하는 옵션이 있습니다.
        BLOCK BLAST — 블록을 놓고 행과 열을 채워 콤보를 이어 가세요.
        BREAKOUT — 공을 튕겨 벽돌을 부수고 아이템을 모으세요.
        SIRTET — 떨어지는 블록을 회전해 줄을 완성하세요. 속도가 점점 빨라집니다.
        스도쿠 — 난이도를 고르고 메모, 힌트, 체크포인트를 활용하세요.
        2048 — 같은 타일을 밀어서 합치세요. 2048을 만든 뒤에도 계속할 수 있습니다.
        몸으로 말해요 — 주제별 낱말 묶음으로 친구와 정답을 맞혀 보세요. 버튼이나 지원 기기의 기울이기 조작을 사용할 수 있습니다.
        지뢰찾기 — 안전한 칸을 열고 지뢰에 깃발을 꽂으세요. 첫 수는 항상 안전합니다.
        리버시 — 상대 돌을 뒤집으세요. 컴퓨터와 대결하거나 친구와 한 기기를 나눠 쓰며 플레이하세요.
        파이프 — 파이프를 회전해 전체 연결망을 이으세요.

        메뉴, 게임 방법, 접근성 레이블은 13개 언어를 지원합니다. 몸으로 말해요에는 번역된 동물과 음식 낱말 묶음이 있으며, 영어 모음에는 다른 주제도 있습니다.

        Day 프레임워크와 각 플랫폼의 네이티브 UI로 만든 오픈 소스 앱입니다. 소스 코드: github.com/Games-Fair/Games-Fair
      keywords: ["솔리테어", "스도쿠", "2048", "몸으로말해요", "지뢰찾기", "리버시", "파이프", "블록", "카드", "퍼즐", "오프라인"]
      release-notes: |-
        앱 하나에 게임 열 가지: 솔리테어, Block Blast, Breakout, 떨어지는 블록, 스도쿠, 2048, 지뢰찾기, 몸으로 말해요, 리버시, 파이프.

        모든 화면은 각 플랫폼의 기본 UI 요소로 그립니다. 게임은 라운드 중간에도 자동으로 저장되고 이어서 할 수 있으며, 앱 전체가 오프라인으로 동작합니다. 광고도, 결제도, 계정도 없습니다.
      promo: "솔리테어, 스도쿠, 2048, 몸으로 말해요 등 게임 10종을 한 앱에서! 진행 상황 자동 저장, 광고와 구매 없음."
    pt-BR:
      subtitle: "Jogos clássicos sem anúncios"
      short: "Dez clássicos: cartas, quebra-cabeças e arcade. Offline e sem anúncios."
      description: |-
        Dez jogos clássicos em um só aplicativo. Jogue offline, sem anúncios, compras ou conta. Suas partidas são salvas automaticamente para você continuar depois.

        PACIÊNCIA — Klondike comprando uma ou três cartas, com dicas e opção de partidas verificadas como solucionáveis.
        BLOCK BLAST — Posicione blocos, complete linhas e colunas e faça combos.
        BREAKOUT — Rebata a bola, quebre tijolos e pegue melhorias.
        SIRTET — Gire os blocos que caem e complete linhas conforme o ritmo aumenta.
        SUDOKU — Escolha a dificuldade, faça anotações, use dicas e salve pontos de controle.
        2048 — Deslize e combine peças iguais. Continue jogando depois de chegar a 2048.
        MÍMICA — Adivinhe com amigos usando baralhos temáticos. Use botões ou controles de inclinação em dispositivos compatíveis.
        CAMPO MINADO — Revele casas seguras e marque minas. A primeira jogada é sempre segura.
        REVERSI — Vire as peças do adversário. Jogue contra o computador ou divida o aparelho com um amigo.
        CANOS — Gire os canos para conectar toda a rede.

        Menus, instruções e rótulos de acessibilidade em 13 idiomas. Mímica inclui baralhos traduzidos de animais e comida; a coleção em inglês oferece outros temas.

        Código aberto, feito com o framework Day e a interface nativa de cada plataforma. Código: github.com/Games-Fair/Games-Fair
      keywords: ["paciência", "sudoku", "2048", "mímica", "campo minado", "reversi", "canos", "blocos", "cartas", "arcade", "offline"]
      release-notes: |-
        Dez jogos em um só app: Paciência, Block Blast, Breakout, blocos que caem, Sudoku, 2048, Campo
        Minado, Mímica, Reversi e Canos.

        Cada tela é desenhada com os controles nativos da plataforma. Os jogos salvam e retomam sozinhos,
        inclusive no meio de uma rodada, e o app inteiro funciona offline, sem anúncios, sem compras e sem
        conta.
      promo: "Paciência, Sudoku, 2048, Mímica e mais: dez jogos com progresso salvo, sem anúncios nem compras."
    ru:
      subtitle: "Классические игры без рекламы"
      short: "Десять классических игр: карты, головоломки и аркады. Офлайн, без рекламы."
      description: |-
        Десять классических игр в одном приложении. Играйте без интернета, рекламы, покупок и регистрации. Партии сохраняются автоматически, чтобы вы могли продолжить позже.

        ПАСЬЯНС — Косынка со сдачей по одной или три карты, подсказками и режимом только проверенных решаемых раскладов.
        BLOCK BLAST — Размещайте блоки, заполняйте ряды и столбцы и собирайте комбо.
        BREAKOUT — Отбивайте мяч, разбивайте кирпичи и собирайте усиления.
        SIRTET — Вращайте падающие блоки и заполняйте линии при возрастающей скорости.
        СУДОКУ — Выбирайте сложность, делайте заметки, используйте подсказки и сохраняйте контрольные точки.
        2048 — Сдвигайте и объединяйте одинаковые плитки. Продолжайте играть после достижения 2048.
        КРОКОДИЛ — Угадывайте слова с друзьями по тематическим колодам. Используйте кнопки или наклоны на поддерживаемых устройствах.
        САПЁР — Открывайте безопасные клетки и отмечайте мины. Первый ход всегда безопасен.
        РЕВЕРСИ — Переворачивайте фишки соперника. Играйте с компьютером или другом на одном устройстве.
        ТРУБЫ — Поворачивайте трубы, чтобы соединить всю сеть.

        Меню, правила и подписи для специальных возможностей доступны на 13 языках. В игре «Крокодил» переведены колоды о животных и еде; в английской коллекции есть дополнительные темы.

        Открытый исходный код, фреймворк Day и родной интерфейс каждой платформы. Код: github.com/Games-Fair/Games-Fair
      keywords: ["пасьянс", "судоку", "2048", "«Крокодил»", "сапёр", "реверси", "трубы", "блоки", "карты", "аркада", "офлайн"]
      release-notes: |-
        Десять игр в одном приложении: Пасьянс, Block Blast, Breakout, падающие блоки, Судоку, 2048,
        Сапёр, Крокодил, Реверси и Трубы.

        Каждый экран нарисован системными элементами самой платформы. Игры сохраняются и восстанавливаются
        сами, в том числе посреди партии, а всё приложение работает офлайн — без рекламы, без покупок и без
        аккаунта.
      promo: "Пасьянс, судоку, 2048, «Крокодил» и другие: десять игр с сохранением прогресса, без рекламы и покупок."
    zh-CN:
      subtitle: "无广告的经典游戏"
      short: "十款经典游戏：纸牌、益智和街机。离线畅玩，无广告。"
      description: |-
        一个应用，十款经典游戏。无需联网、广告、购买或注册账号，即可畅玩。游戏进度自动保存，随时继续。

        纸牌接龙 — 支持一次翻一张或三张的克朗代克纸牌。提供提示，还可选择仅玩经过验证可解的牌局。
        BLOCK BLAST — 放置方块，填满行列并连续消除，获得连击。
        BREAKOUT — 反弹小球、击碎砖块并收集强化道具。
        SIRTET — 旋转下落的方块并填满整行，挑战不断加快的节奏。
        数独 — 选择难度，使用笔记和提示，保存检查点。
        2048 — 滑动并合并相同的方块。达到2048后仍可继续。
        你说我猜 — 与朋友一起猜主题词卡。使用按钮操作，也可在支持的设备上倾斜操作。
        扫雷 — 翻开安全格并标记地雷。第一步始终安全。
        黑白棋 — 翻转对手的棋子。可与电脑对战，也可和朋友共用一台设备。
        水管 — 旋转水管方块，连接整个管网。

        菜单、玩法说明和无障碍标签支持13种语言。你说我猜包含已翻译的动物和食物词卡，英语词卡还提供更多主题。

        开源应用，使用Day框架及各平台原生界面构建。源代码：github.com/Games-Fair/Games-Fair
      keywords: ["纸牌", "数独", "2048", "你说我猜", "扫雷", "黑白棋", "水管", "方块", "街机", "益智", "离线"]
      release-notes: |-
        十款游戏，一个应用：纸牌接龙、Block Blast、Breakout、方块下落、数独、2048、扫雷、你说我猜、黑白棋、水管。

        每个界面都用各平台自己的原生控件绘制。游戏会自动保存和恢复，中途退出也不例外；整个应用离线运行，没有广告、没有内购、无需账号。
      promo: "纸牌、数独、2048、你说我猜等十款游戏，尽在一个应用中。自动保存进度，无广告，无内购。"

