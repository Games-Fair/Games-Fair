[package]
name = "gamekit"
version.workspace = true
edition = "2024"
license = "Apache-2.0"

# The games' shared save-state mechanism: serde_json snapshots in day-part-preferences, written on
# game exit (scope cleanup) and on app backgrounding (lifecycle phases where delivered).

[dependencies]
day-core = "0.6"
day-reactive = "0.6"
day-spec = "0.6"
day-part-preferences = "0.6"
# The shared game chrome (`chrome`): composed from Day's core pieces, localized through
# Fluent, with sounds and haptics behind each game's Sounds and Vibrations settings.
day-pieces = "0.6"
day-localization-ui = "0.6"
day-part-haptics = "0.6"
day-part-sound = "0.6"
# The app-wide Sounds and Vibrations defaults (`chrome::SOUNDS`, `chrome::VIBRATIONS`) are
# day-piece-settings prefs: the shell's Settings rows write them, a game's first settings
# record reads them.
day-piece-settings = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The web build has no `SystemTime`; `seed()` draws browser entropy through the getrandom
# bridge day-toolkit-dom already answers (docs/web.md).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", default-features = false }
