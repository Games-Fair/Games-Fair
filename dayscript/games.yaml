# Gameplay sweep for screenshots. Run with `--env DAY_GAMES_SEED=15` so the Sudoku cells it
# taps are empty (see dayscript/sudoku.yaml).
name: games
flow:
  - wait_for: { id: home }
  - screenshot: { name: home, title: Home, caption: "Every game is one tap away, and every tile is drawn by the game it opens.", source: src/lib.rs }
  # Every game opens its rules by itself the first time it is played; opening each once
  # first makes the sweep below the same from any saved state.
  - navigate: { route: breakout }
  - pause: { secs: 0.6 }
  - nav_back: {}
  - pause: { secs: 0.5 }
  - navigate: { route: sirtet }
  - pause: { secs: 0.6 }
  - nav_back: {}
  - pause: { secs: 0.5 }
  - navigate: { route: twentyfortyeight }
  - pause: { secs: 0.6 }
  - nav_back: {}
  - pause: { secs: 0.5 }
  - navigate: { route: blockblast }
  - pause: { secs: 0.6 }
  - nav_back: {}
  - pause: { secs: 0.5 }
  - navigate: { route: solitaire }
  - pause: { secs: 0.6 }
  - nav_back: {}
  - pause: { secs: 0.5 }
  - navigate: { route: charades }
  - pause: { secs: 0.6 }
  - nav_back: {}
  - pause: { secs: 0.5 }
  - navigate: { route: mines }
  - pause: { secs: 0.6 }
  - nav_back: {}
  - pause: { secs: 0.5 }
  - navigate: { route: flipside }
  - pause: { secs: 0.6 }
  - nav_back: {}
  - pause: { secs: 0.5 }
  - navigate: { route: pipes }
  - pause: { secs: 0.6 }
  - nav_back: {}
  - pause: { secs: 0.5 }
  - navigate: { route: pacpac }
  - pause: { secs: 0.6 }
  - nav_back: {}
  - pause: { secs: 0.5 }
  # Block Blast from the keyboard, on a fresh Normal deal so the pieces are the seeded ones
  # (dayscript/blockblast.yaml explains the moves): three placements, then a fourth that
  # clears the top row, photographed while the preview is lit and mid-clear.
  - navigate: { route: blockblast }
  - pause: { secs: 0.8 }
  - tap: { id: bb_pause }
  - pause: { secs: 0.4 }
  - tap: { id: bb_new_game }
  - pause: { secs: 0.4 }
  - tap: { id: bb_diff_normal }
  - pause: { secs: 0.8 }
  - key: { id: bb_canvas, key: "3" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowLeft" }
  - key: { id: bb_canvas, key: "ArrowLeft" }
  - key: { id: bb_canvas, key: "3" }
  - pause: { secs: 0.3 }
  - key: { id: bb_canvas, key: "1" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowRight" }
  - key: { id: bb_canvas, key: "1" }
  - pause: { secs: 0.3 }
  - key: { id: bb_canvas, key: "2" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowRight" }
  - key: { id: bb_canvas, key: "ArrowRight" }
  - key: { id: bb_canvas, key: "2" }
  - pause: { secs: 0.6 }
  - key: { id: bb_canvas, key: "2" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowRight" }
  - key: { id: bb_canvas, key: "ArrowRight" }
  - key: { id: bb_canvas, key: "ArrowRight" }
  - pause: { secs: 0.2 }
  - screenshot: blockblast-lift
  - key: { id: bb_canvas, key: "2" }
  - pause: { secs: 0.35 }
  - screenshot: { name: blockblast, title: Block Blast, caption: "Drag pieces onto the board; full rows and columns clear, and back-to-back clears build a combo.", source: games/blockblast/src/lib.rs }
  - nav_back: {}
  - pause: { secs: 0.6 }
  # Solitaire: a fresh Turn One deal, proven winnable before it is dealt, and 9 sending its aces
  # home (dayscript/solitaire.yaml explains the keys).
  - navigate: { route: solitaire }
  - pause: { secs: 0.8 }
  - tap: { id: sol_pause }
  - pause: { secs: 0.4 }
  - tap: { id: sol_new_game }
  - pause: { secs: 0.4 }
  - tap: { id: sol_draw_1 }
  - pause: { secs: 3.0 }
  - key: { id: sol_canvas, key: "9" }
  - pause: { secs: 0.12 }
  - screenshot: solitaire-flight
  - pause: { secs: 1.0 }
  - key: { id: sol_canvas, key: "9" }
  - pause: { secs: 1.0 }
  - screenshot: { name: solitaire, title: Solitaire, caption: "Klondike, one card at a time or three; with Winnable Deals Only on, a solver proves every deal before it reaches the table.", source: games/solitaire/src/lib.rs }
  - nav_back: {}
  - pause: { secs: 0.6 }
  # Charades: the decks, then a card from a round started by hand (dayscript/charades.yaml
  # explains why tilting goes off first).
  - navigate: { route: charades }
  - pause: { secs: 0.6 }
  - screenshot: { name: charades, title: Charades, caption: "Hold the phone to your forehead, let your friends give clues, and nod when you guess right.", source: games/charades/src/lib.rs }
  - tap: { id: ch_settings }
  - pause: { secs: 0.4 }
  - toggle: { id: ch_tilt, value: false }
  - tap: { id: ch_done }
  - pause: { secs: 0.4 }
  - tap: { id: 'ch_deck:animals' }
  - pause: { secs: 0.5 }
  - tap: { id: ch_start }
  - pause: { secs: 3.6 }
  - screenshot: charades-card
  - nav_back: {}
  - pause: { secs: 0.6 }
  # Mines: a fresh Easy board with a flag planted beside the opening. A flagged square holds the
  # cascade, so the flag is still there once the clearing runs into it.
  - navigate: { route: mines }
  - pause: { secs: 0.6 }
  - tap: { id: mi_pause }
  - pause: { secs: 0.4 }
  - tap: { id: mi_new_game }
  - pause: { secs: 0.4 }
  - tap: { id: mi_diff_easy }
  - pause: { secs: 0.6 }
  - key: { id: mi_board, key: "f" }
  - key: { id: mi_board, key: "ArrowDown" }
  - key: { id: mi_board, key: " " }
  - pause: { secs: 0.6 }
  - screenshot: { name: mines, title: Mines, caption: "The classic sweeper: your first tap is always safe, hold a square to flag it, and the board turns with the window.", source: games/mines/src/lib.rs }
  - nav_back: {}
  - pause: { secs: 0.6 }
  - navigate: { route: breakout }
  - pause: { secs: 0.6 }
  - tap: { id: bk_canvas }
  - pause: { secs: 0.9 }
  - screenshot: { name: breakout-a, title: Breakout, caption: "The paddle glides under your finger or pointer; combos, power-ups, and armored bricks follow.", source: games/breakout/src/lib.rs }
  - pause: { secs: 0.7 }
  - screenshot: breakout-b
  - nav_back: {}
  - pause: { secs: 0.6 }
  - navigate: { route: sirtet }
  - pause: { secs: 0.5 }
  - tap: { id: st_canvas }
  - tap: { id: st_canvas }
  - pause: { secs: 0.4 }
  - screenshot: sirtet-a
  - pause: { secs: 1.0 }
  - screenshot: { name: sirtet-b, title: Sirtet, caption: "Falling blocks with the next piece shown and a call-out for every clear.", source: games/sirtet/src/lib.rs }
  - nav_back: {}
  - pause: { secs: 0.6 }
  - navigate: { route: twentyfortyeight }
  - pause: { secs: 0.6 }
  - screenshot: { name: g2048, title: "2048", caption: "Slide, merge, and chase your best score.", source: games/twentyfortyeight/src/lib.rs }
  # New Game asks for the rules; Easy adds the undo button beside pause.
  - tap: { id: tf_pause }
  - pause: { secs: 0.4 }
  - tap: { id: tf_new_game }
  - pause: { secs: 0.4 }
  - assert_visible: { id: tf_difficulty_picker }
  - screenshot: { name: g2048-difficulty, title: "2048 difficulty", caption: "Easy grants three undos; Hard spawns two tiles a move.", source: games/twentyfortyeight/src/lib.rs }
  - tap: { id: tf_diff_easy }
  - pause: { secs: 0.5 }
  - assert_visible: { id: tf_undo }
  - screenshot: g2048-easy
  - nav_back: {}
  - pause: { secs: 0.6 }
  - navigate: { route: sudoku }
  - pause: { secs: 0.8 }
  - nav_back: {}
  - pause: { secs: 0.6 }
  - navigate: { route: sudoku }
  - pause: { secs: 0.8 }
  - tap: { id: 'su_cell:40' }
  - tap: { id: 'su_key:5' }
  - pause: { secs: 0.4 }
  - screenshot: { name: sudoku, title: Sudoku, caption: "Pencil marks, a checkpoint you can commit or revert, and a best time per difficulty.", source: games/sudoku/src/lib.rs }
  - nav_back: {}

  - navigate: { route: flipside }
  - pause: { secs: 0.6 }
  - assert_visible: { id: fs_board }
  - screenshot: flipside
  - nav_back: {}

  - navigate: { route: pipes }
  - pause: { secs: 0.6 }
  - assert_visible: { id: pp_board }
  - screenshot: pipes
  - nav_back: {}

  # Pac-Pac: a fresh Pac-Pac round, photographed once READY! has given way to play.
  - navigate: { route: pacpac }
  - pause: { secs: 0.6 }
  - tap: { id: pm_pause }
  - pause: { secs: 0.4 }
  - tap: { id: pm_new_game }
  - pause: { secs: 0.4 }
  - tap: { id: pm_mode_pacpac }
  - pause: { secs: 5.5 }
  - key: { id: pm_canvas, key: "ArrowDown" }
  - pause: { secs: 1.0 }
  - screenshot: { name: pacpac, title: Pac-Pac, caption: "Pac-Pac and Ms. Pac-Pac at the arcade's pixels: the ghosts' real targets, the real speeds, and the sirens.", source: games/pacpac/src/lib.rs }
  - nav_back: {}

  # Settings is the shared surface (https://daybrite.dev/docs/settings). The app menu's
  # Settings… item opens a window on a desktop, and on the web, whose menu button carries the
  # same item, a cover. A phone has no app menu, so the gear beside the home title presents the
  # cover there. The cover's root lists the groups, so the phones and the web step into General.
  # The cover draws inside the main window, so one capture key serves every target.
  - menu: { key: day_preferences, skip_on: [uikit, material, arkui] }
  - tap: { id: home_settings, only_on: [uikit, material, arkui] }
  - tap: { id: 'prefs_group:general', only_on: [uikit, material, arkui, dom] }
  - wait_for: { id: language_picker }
  - screenshot: { name: settings, window: day.preferences }
  - close_window: { window: day.preferences }
