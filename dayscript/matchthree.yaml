# Run with --env DAY_GAMES_SEED=15 --locale en. Uses the real rules and normal controls.
# Level moves are checked by model::tests::deterministic_levels_are_winnable.
name: matchthree
flow:
  - {"wait_for": {"id": "home"}}
  - {"navigate": {"route": "matchthree"}}
  - {"pause": {"secs": 0.4}}
  - {"nav_back": {}}
  - {"pause": {"secs": 0.4}}
  - {"navigate": {"route": "matchthree"}}
  - {"pause": {"secs": 0.4}}
  - {"tap": {"id": "mt_map"}}
  - {"tap": {"id": "mt_stage:1"}}
  - {"assert_text": {"id": "mt_score", "text": "0"}}
  - {"assert_text": {"id": "mt_moves", "text": "22"}}
  - {"screenshot": "match-three-opening"}
  - {"key": {"id": "mt_board", "key": "Home"}}
  - {"key": {"id": "mt_board", "key": "Enter"}}
  - {"key": {"id": "mt_board", "key": "ArrowRight"}}
  - {"key": {"id": "mt_board", "key": "Enter"}}
  - {"assert_text": {"id": "mt_status", "key": "mt_swap_hint", "timeout_secs": 30}}
  - {"assert_text": {"id": "mt_moves", "text": "22"}}
  - {"assert_text": {"id": "mt_score", "text": "0"}}
  - {"tap": {"id": "mt_pause"}}
  - {"key": {"id": "mt_board", "key": "h"}}
  - {"key": {"id": "mt_board", "key": "Enter"}}
  - {"assert_text": {"id": "mt_moves", "text": "22"}}
  - {"tap": {"id": "mt_resume"}}
  - {"key": {"id": "mt_board", "key": "Home"}}
  - {"key": {"id": "mt_board", "key": "ArrowDown"}}
  - {"key": {"id": "mt_board", "key": "ArrowDown"}}
  - {"key": {"id": "mt_board", "key": "ArrowDown"}}
  - {"key": {"id": "mt_board", "key": "ArrowDown"}}
  - {"key": {"id": "mt_board", "key": "ArrowDown"}}
  - {"key": {"id": "mt_board", "key": "ArrowDown"}}
  - {"key": {"id": "mt_board", "key": "ArrowRight"}}
  - {"key": {"id": "mt_board", "key": "ArrowRight"}}
  - {"key": {"id": "mt_board", "key": "ArrowRight"}}
  - {"key": {"id": "mt_board", "key": "ArrowRight"}}
  - {"key": {"id": "mt_board", "key": "Enter"}}
  - {"key": {"id": "mt_board", "key": "ArrowRight"}}
  - {"key": {"id": "mt_board", "key": "Enter"}}
  - {"assert_text": {"id": "mt_score", "text": "12540"}}
  - {"assert_text": {"id": "mt_moves", "text": "21"}}
  - {"assert_text": {"id": "mt_status", "key": "mt_swap_hint", "timeout_secs": 30}}
  - {"wait_for": {"id": "mt_result", "timeout_secs": 30}}
  - {"assert_text": {"id": "mt_final_score", "text": "12540"}}
  - {"screenshot": "match-three-victory"}
  - {"tap": {"id": "mt_next"}}
  - {"assert_text": {"id": "mt_moves", "text": "26"}}
  - {"key": {"id": "mt_board", "key": "Home"}}
  - {"key": {"id": "mt_board", "key": "ArrowDown"}}
  - {"key": {"id": "mt_board", "key": "ArrowDown"}}
  - {"key": {"id": "mt_board", "key": "ArrowDown"}}
  - {"key": {"id": "mt_board", "key": "ArrowDown"}}
  - {"key": {"id": "mt_board", "key": "ArrowDown"}}
  - {"key": {"id": "mt_board", "key": "ArrowRight"}}
  - {"key": {"id": "mt_board", "key": "ArrowRight"}}
  - {"key": {"id": "mt_board", "key": "ArrowRight"}}
  - {"key": {"id": "mt_board", "key": "ArrowRight"}}
  - {"key": {"id": "mt_board", "key": "Enter"}}
  - {"key": {"id": "mt_board", "key": "ArrowDown"}}
  - {"key": {"id": "mt_board", "key": "Enter"}}
  - {"assert_text": {"id": "mt_score", "text": "600"}}
  - {"assert_text": {"id": "mt_moves", "text": "25"}}
  - {"assert_text": {"id": "mt_status", "key": "mt_swap_hint", "timeout_secs": 30}}
  - {"nav_back": {}}
  - {"pause": {"secs": 0.4}}
  - {"navigate": {"route": "matchthree"}}
  - {"pause": {"secs": 0.4}}
  - {"assert_text": {"id": "mt_score", "text": "600"}}
  - {"assert_text": {"id": "mt_moves", "text": "25"}}
  - {"tap": {"id": "mt_pause"}}
  - {"tap": {"id": "mt_settings"}}
  - {"toggle": {"id": "mt_sounds", "value": false}}
  - {"toggle": {"id": "mt_vibrations", "value": false}}
  - {"toggle": {"id": "mt_reduced", "value": true}}
  - {"assert_value": {"id": "mt_sounds", "value": false}}
  - {"assert_value": {"id": "mt_vibrations", "value": false}}
  - {"assert_value": {"id": "mt_reduced", "value": true}}
  - {"select": {"id": "mt_theme", "index": 1}}
  - {"tap": {"id": "mt_settings_done"}}
  - {"tap": {"id": "mt_resume"}}
  # A theme changes only the look: the level carries on where it was.
  - {"assert_text": {"id": "mt_score", "text": "600"}}
  - {"assert_text": {"id": "mt_moves", "text": "25"}}
  - {"screenshot": "match-three-stones"}
  - {"tap": {"id": "mt_pause"}}
  - {"tap": {"id": "mt_settings"}}
  - {"toggle": {"id": "mt_sounds", "value": true}}
  - {"toggle": {"id": "mt_vibrations", "value": true}}
  - {"toggle": {"id": "mt_reduced", "value": false}}
  - {"select": {"id": "mt_theme", "index": 0}}
  - {"tap": {"id": "mt_settings_done"}}
  - {"tap": {"id": "mt_instructions"}}
  - {"assert_visible": {"id": "mt_help"}}
  - {"tap": {"id": "mt_help_done"}}
  - {"tap": {"id": "mt_resume"}}
  - {"assert_no_placeholders": {}}
  - {"screenshot": "match-three-ready"}
