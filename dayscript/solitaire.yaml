# Solitaire walkthrough (https://daybrite.dev/docs/dayscript): a Turn One deal played from the
# keyboard, a hint and an undo, then the pause menu, the draw picker, settings, and the rules.
#
#     day launch -p macos-appkit --env DAY_GAMES_SEED=15 --script dayscript/solitaire.yaml
#
# The seed pins the deal the solver proves winnable, so the keys below score 15, 30 and 35
# (games/solitaire/src/lib.rs pins the deal, the keys and the scores).
name: solitaire
flow:
  - wait_for: { id: home }
  - assert_visible: { id: tile_solitaire }
  # The rules open by themselves the first time the game is played; a second open skips them,
  # so the walkthrough works from any saved state (the sheet is exercised from the pause menu).
  - navigate: { route: solitaire }
  - pause: { secs: 0.8 }
  - nav_back: {}
  - pause: { secs: 0.6 }
  - navigate: { route: solitaire }
  - pause: { secs: 0.8 }
  - assert_visible: { id: sol_canvas }
  # A new Turn One game, so the seeded deal is the one the unit test knows.
  - tap: { id: sol_pause }
  - pause: { secs: 0.4 }
  - assert_visible: { id: sol_pause_menu }
  - tap: { id: sol_new_game }
  - pause: { secs: 0.4 }
  - assert_visible: { id: sol_draw_picker }
  - screenshot: solitaire-draw
  - tap: { id: sol_draw_1 }
  - pause: { secs: 0.4 }
  - screenshot: solitaire-shuffle
  # The shuffle, then the deal cascade.
  - pause: { secs: 2.6 }
  - assert_text: { id: sol_score, text: "0" }
  - screenshot: solitaire-dealt
  # 9 sends the ace of diamonds home and turns up the ace of spades; 9 sends that home too.
  - key: { id: sol_canvas, key: "9" }
  - pause: { secs: 0.12 }
  - screenshot: solitaire-home
  - pause: { secs: 1.0 }
  - assert_text: { id: sol_score, text: "15" }
  - key: { id: sol_canvas, key: "9" }
  - pause: { secs: 1.0 }
  - assert_text: { id: sol_score, text: "30" }
  # 6 picks the ten of hearts, 3 puts it on the jack of spades, and the card under it turns up.
  - key: { id: sol_canvas, key: "6" }
  - pause: { secs: 0.3 }
  - screenshot: solitaire-pick
  - key: { id: sol_canvas, key: "3" }
  - pause: { secs: 1.0 }
  - assert_text: { id: sol_score, text: "35" }
  # 0 turns the stock.
  - key: { id: sol_canvas, key: "0" }
  - pause: { secs: 0.6 }
  - assert_text: { id: sol_moves, text: "4" }
  - tap: { id: sol_hint }
  - pause: { secs: 0.5 }
  - screenshot: solitaire-hint
  - tap: { id: sol_undo }
  - pause: { secs: 0.6 }
  - assert_text: { id: sol_moves, text: "3" }
  # Settings and the rules sheet from the pause menu; Done returns to it while a game is live.
  - tap: { id: sol_pause }
  - pause: { secs: 0.4 }
  - tap: { id: sol_settings }
  - pause: { secs: 0.4 }
  - assert_visible: { id: sol_settings_card }
  - assert_visible: { id: sol_winnable }
  - screenshot: solitaire-settings
  - tap: { id: sol_done }
  - pause: { secs: 0.3 }
  - tap: { id: sol_instructions }
  - pause: { secs: 0.4 }
  - assert_visible: { id: sol_instructions_card }
  - screenshot: solitaire-rules
  - tap: { id: sol_help_done }
  - pause: { secs: 0.3 }
  - assert_visible: { id: sol_pause_menu }
  - tap: { id: sol_resume }
  - pause: { secs: 0.3 }
  - nav_back: {}
  - pause: { secs: 0.6 }
  - assert_visible: { id: tile_solitaire }
