name: shared-close-command
description: Header close and pause-menu Close Game share the shell's leave-game command.
flow:
  - wait_for: { id: home }
  # A fresh install opens each game on its rules, which hold the pause menu shut: open and leave
  # each game once so the rules are consumed (as frame-sync.yaml does).
  - navigate: { route: flipside }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: mines }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: flipside }
  - wait_for: { id: fs_pause }
  - tap: { id: fs_pause }
  - wait_for: { id: fs_quit }
  - screenshot: command-flipside-quit
  - tap: { id: fs_quit }
  - wait_for: { id: home }
  - assert_missing: { id: fs_pause }
  - navigate: { route: flipside }
  - wait_for: { id: close_game }
  - tap: { id: close_game }
  - wait_for: { id: home }
  - assert_missing: { id: fs_pause }
  - navigate: { route: mines }
  - wait_for: { id: mi_pause }
  - tap: { id: mi_pause }
  - wait_for: { id: mi_quit }
  - screenshot: command-mines-quit
  - tap: { id: mi_quit }
  - wait_for: { id: home }
  - assert_missing: { id: mi_pause }
