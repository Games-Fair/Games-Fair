name: escape-pauses
description: In every game, Escape opens the pause menu (with Resume and Close Game) and Escape again resumes.
flow:
  - wait_for: { id: home }
  # A fresh install opens each game on its rules: open and leave each game once to consume them.
  - navigate: { route: blockblast }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: breakout }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: charades }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: flipside }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: pacpac }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: matchthree }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: mines }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: pipes }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: sirtet }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: solitaire }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: sudoku }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: twentyfortyeight }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  # blockblast
  - navigate: { route: blockblast }
  - wait_for: { id: bb_pause }
  # Start from the pause menu (a saved game may already open there).
  - tap: { id: bb_pause }
  - wait_for: { id: bb_pause_menu }
  - key: { id: bb_canvas, key: Escape }
  - assert_missing: { id: bb_pause_menu }
  - key: { id: bb_canvas, key: Escape }
  - wait_for: { id: bb_pause_menu }
  - assert_visible: { id: bb_resume }
  - assert_visible: { id: bb_quit }
  - key: { id: bb_canvas, key: Escape }
  - assert_missing: { id: bb_pause_menu }
  - tap: { id: close_game }
  - wait_for: { id: home }
  # breakout
  - navigate: { route: breakout }
  - wait_for: { id: bk_pause }
  # Start from the pause menu (a saved game may already open there).
  - tap: { id: bk_pause }
  - wait_for: { id: bk_pause_menu }
  - key: { id: bk_canvas, key: Escape }
  - assert_missing: { id: bk_pause_menu }
  - key: { id: bk_canvas, key: Escape }
  - wait_for: { id: bk_pause_menu }
  - assert_visible: { id: bk_resume }
  - assert_visible: { id: bk_quit }
  - key: { id: bk_canvas, key: Escape }
  - assert_missing: { id: bk_pause_menu }
  - tap: { id: close_game }
  - wait_for: { id: home }
  # charades: the deck picker has nothing to pause; a chosen deck waiting to start does.
  - navigate: { route: charades }
  - wait_for: { id: 'ch_deck:animals' }
  - tap: { id: 'ch_deck:animals' }
  - wait_for: { id: ch_start }
  # Start from the pause menu (a saved game may already open there).
  - tap: { id: ch_pause }
  - wait_for: { id: ch_pause_menu }
  - key: { id: ch_canvas, key: Escape }
  - assert_missing: { id: ch_pause_menu }
  - key: { id: ch_canvas, key: Escape }
  - wait_for: { id: ch_pause_menu }
  - assert_visible: { id: ch_resume }
  - assert_visible: { id: ch_quit }
  - key: { id: ch_canvas, key: Escape }
  - assert_missing: { id: ch_pause_menu }
  - tap: { id: close_game }
  - wait_for: { id: home }
  # flipside
  - navigate: { route: flipside }
  - wait_for: { id: fs_pause }
  # Start from the pause menu (a saved game may already open there).
  - tap: { id: fs_pause }
  - wait_for: { id: fs_pause_menu }
  - key: { id: fs_board, key: Escape }
  - assert_missing: { id: fs_pause_menu }
  - key: { id: fs_board, key: Escape }
  - wait_for: { id: fs_pause_menu }
  - assert_visible: { id: fs_resume }
  - assert_visible: { id: fs_quit }
  - key: { id: fs_board, key: Escape }
  - assert_missing: { id: fs_pause_menu }
  - tap: { id: close_game }
  - wait_for: { id: home }
  # pacpac
  - navigate: { route: pacpac }
  - wait_for: { id: pm_pause }
  # Start from the pause menu (a saved game may already open there, or the game picker).
  - tap: { id: pm_pause }
  - wait_for: { id: pm_pause_menu }
  - key: { id: pm_canvas, key: Escape }
  - assert_missing: { id: pm_pause_menu }
  - key: { id: pm_canvas, key: Escape }
  - wait_for: { id: pm_pause_menu }
  - assert_visible: { id: pm_resume }
  - assert_visible: { id: pm_quit }
  - key: { id: pm_canvas, key: Escape }
  - assert_missing: { id: pm_pause_menu }
  - tap: { id: close_game }
  - wait_for: { id: home }
  # matchthree
