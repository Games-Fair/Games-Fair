  - key: { id: pp_board, key: Escape }
  - wait_for: { id: pp_pause_menu }
  - assert_visible: { id: pp_resume }
  - assert_visible: { id: pp_quit }
  - key: { id: pp_board, key: Escape }
  - assert_missing: { id: pp_pause_menu }
  - tap: { id: close_game }
  - wait_for: { id: home }
  # sirtet
  - navigate: { route: sirtet }
