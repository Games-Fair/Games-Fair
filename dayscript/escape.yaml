  - wait_for: { id: mt_pause }
  # Start from the pause menu (a saved game may already open there).
  - tap: { id: mt_pause }
  - wait_for: { id: mt_pause_card }
  - key: { id: mt_board, key: Escape }
  - assert_missing: { id: mt_pause_card }
  - key: { id: mt_board, key: Escape }
  - wait_for: { id: mt_pause_card }
  - assert_visible: { id: mt_resume }
  - assert_visible: { id: mt_close }
  - key: { id: mt_board, key: Escape }
  - assert_missing: { id: mt_pause_card }
  - tap: { id: close_game }
  - wait_for: { id: home }
  # mines
  - navigate: { route: mines }
  - wait_for: { id: mi_pause }
  # Start from the pause menu (a saved game may already open there).
  - tap: { id: mi_pause }
