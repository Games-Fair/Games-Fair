  - key: { id: st_canvas, key: Escape }
  - assert_missing: { id: st_pause_menu }
  - key: { id: st_canvas, key: Escape }
  - wait_for: { id: st_pause_menu }
  - assert_visible: { id: st_resume }
  - assert_visible: { id: st_quit }
  - key: { id: st_canvas, key: Escape }
  - assert_missing: { id: st_pause_menu }
  - tap: { id: close_game }
  - wait_for: { id: home }
  # solitaire
  - navigate: { route: solitaire }
  - wait_for: { id: sol_pause }
  # Start from the pause menu (a saved game may already open there).
  - tap: { id: sol_pause }
  - wait_for: { id: sol_pause_menu }
  - key: { id: sol_canvas, key: Escape }
  - assert_missing: { id: sol_pause_menu }
  - key: { id: sol_canvas, key: Escape }
  - wait_for: { id: sol_pause_menu }
  - assert_visible: { id: sol_resume }
  - assert_visible: { id: sol_quit }
  - key: { id: sol_canvas, key: Escape }
  - assert_missing: { id: sol_pause_menu }
  - tap: { id: close_game }
  - wait_for: { id: home }
  # sudoku
  - navigate: { route: sudoku }
  - wait_for: { id: su_pause }
  # Start from the pause menu (a saved game may already open there).
  - tap: { id: su_pause }
  - wait_for: { id: su_pause_menu }
  - key: { id: su_backdrop, key: Escape }
  - assert_missing: { id: su_pause_menu }
  - key: { id: su_backdrop, key: Escape }
  - wait_for: { id: su_pause_menu }
  - assert_visible: { id: su_resume }
  - assert_visible: { id: su_quit }
  - key: { id: su_backdrop, key: Escape }
  - assert_missing: { id: su_pause_menu }
  - tap: { id: close_game }
