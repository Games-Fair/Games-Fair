name: escape-pauses
description: In every game, Escape opens the pause menu (with Resume and Close Game) and Escape again resumes.
flow:
  - wait_for: { id: home }
  # A fresh install opens each game on its rules: open and leave each game once to consume them.
  - navigate: { route: blockblast }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: breakout }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: charades }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: flipside }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: matchthree }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: mines }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: pipes }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: sirtet }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: solitaire }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: sudoku }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: twentyfortyeight }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  # blockblast
  - navigate: { route: blockblast }
  - wait_for: { id: bb-pause }
  # Start from the pause menu (a saved game may already open there).
  - tap: { id: bb-pause }
  - wait_for: { id: bb-pause-menu }
  - key: { id: bb-canvas, key: Escape }
  - assert_missing: { id: bb-pause-menu }
  - key: { id: bb-canvas, key: Escape }
  - wait_for: { id: bb-pause-menu }
  - assert_visible: { id: bb-resume }
  - assert_visible: { id: bb-quit }
  - key: { id: bb-canvas, key: Escape }
  - assert_missing: { id: bb-pause-menu }
  - tap: { id: close-game }
  - wait_for: { id: home }
  # breakout
  - navigate: { route: breakout }
  - wait_for: { id: bk-pause }
  # Start from the pause menu (a saved game may already open there).
  - tap: { id: bk-pause }
  - wait_for: { id: bk-pause-menu }
  - key: { id: bk-canvas, key: Escape }
  - assert_missing: { id: bk-pause-menu }
  - key: { id: bk-canvas, key: Escape }
  - wait_for: { id: bk-pause-menu }
  - assert_visible: { id: bk-resume }
  - assert_visible: { id: bk-quit }
  - key: { id: bk-canvas, key: Escape }
  - assert_missing: { id: bk-pause-menu }
  - tap: { id: close-game }
  - wait_for: { id: home }
  # charades: the deck picker has nothing to pause; a chosen deck waiting to start does.
  - navigate: { route: charades }
  - wait_for: { id: ch-deck-animals }
  - tap: { id: ch-deck-animals }
  - wait_for: { id: ch-start }
  # Start from the pause menu (a saved game may already open there).
  - tap: { id: ch-pause }
  - wait_for: { id: ch-pause-menu }
  - key: { id: ch-canvas, key: Escape }
  - assert_missing: { id: ch-pause-menu }
  - key: { id: ch-canvas, key: Escape }
  - wait_for: { id: ch-pause-menu }
  - assert_visible: { id: ch-resume }
  - assert_visible: { id: ch-quit }
  - key: { id: ch-canvas, key: Escape }
  - assert_missing: { id: ch-pause-menu }
  - tap: { id: close-game }
  - wait_for: { id: home }
