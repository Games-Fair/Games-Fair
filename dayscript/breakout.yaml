# Breakout walkthrough (https://daybrite.dev/docs/dayscript): a fresh game, the launch, the
# pause menu, settings, and the how-to-play sheet.
#
#     day launch -p macos-appkit --env DAY_GAMES_SEED=15 --script dayscript/breakout.yaml
#
name: breakout
flow:
  - wait_for: { id: home }
  # The instructions open by themselves the first time the game is played; a second open
  # skips them (the sheet is exercised from the pause menu below).
  - navigate: { route: breakout }
  - pause: { secs: 0.8 }
  - nav_back: {}
  - pause: { secs: 0.6 }
  - navigate: { route: breakout }
  - pause: { secs: 0.6 }
  - assert_visible: { id: bk_canvas }
  # Whatever was saved, start fresh: the pause button opens the menu (a resumed game is
  # already showing it), and New Game parks a new ball on the paddle.
  - tap: { id: bk_pause }
  - pause: { secs: 0.4 }
  - assert_visible: { id: bk_pause_menu }
  - tap: { id: bk_new_game }
  - pause: { secs: 0.4 }
  - screenshot: breakout-ready
  # A tap launches the ball; the physics run on the frame clock. Pause while the ball is still
  # climbing: the rules sheet below returns to the pause menu only while a round is live, and a
  # slow capture (an Android emulator's) would let the ball fall past the paddle first.
  - tap: { id: bk_canvas }
  - pause: { secs: 0.4 }
  - tap: { id: bk_pause }
  - pause: { secs: 0.4 }
  - assert_visible: { id: bk_pause_menu }
  - screenshot: breakout-paused
  - tap: { id: bk_settings }
  - pause: { secs: 0.4 }
  - assert_visible: { id: bk_settings_card }
  - screenshot: breakout-settings
  - tap: { id: bk_done }
  - pause: { secs: 0.3 }
  - tap: { id: bk_instructions }
  - pause: { secs: 0.4 }
  - assert_visible: { id: bk_instructions_card }
  - screenshot: breakout-instructions
  - tap: { id: bk_help_done }
  - pause: { secs: 0.3 }
  - assert_visible: { id: bk_pause_menu }
  - tap: { id: bk_resume }
  - pause: { secs: 1.0 }
  - screenshot: breakout-play
  - nav_back: {}
  - pause: { secs: 0.6 }
  - assert_visible: { id: tile_breakout }
