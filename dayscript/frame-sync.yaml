# SPDX-License-Identifier: AGPL-3.0-only WITH App-Fair-Distribution-Exception
# Run with --env DAY_GAMES_SEED=15 --locale en.
# Rules screens are consumed by the first open; each board is then reset via normal controls.
name: frame-sync
description: Animations wake after idle, survive pause/resume, and release closed covers.
flow:
  - wait_for: { id: home }
  - navigate: { route: flipside }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: flipside }
  - tap: { id: fs_pause }
  - tap: { id: fs_new_game }
  - select: { id: fs_mode, index: 1 }
  - tap: { id: fs_start }
  - pause: { secs: 1.0 }
  - key: { id: fs_board, key: Enter }
  - pause: { secs: 1.0 }
  - assert_text: { id: fs_black_score, text: "4" }
  - assert_text: { id: fs_white_score, text: "1" }
  - key: { id: fs_board, key: ArrowLeft }
  - key: { id: fs_board, key: Enter }
  - pause: { secs: 1.0 }
  - assert_text: { id: fs_black_score, text: "3" }
  - assert_text: { id: fs_white_score, text: "3" }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: pipes }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: pipes }
  - tap: { id: pp_pause }
  - tap: { id: pp_new_game }
  - select: { id: pp_size, index: 0 }
  - tap: { id: pp_start }
  - pause: { secs: 1.0 }
  - key: { id: pp_board, key: Enter }
  - pause: { secs: 1.0 }
  - assert_text: { id: pp_moves, text: "1" }
  - tap: { id: pp_pause }
  - pause: { secs: 0.5 }
  - key: { id: pp_board, key: Enter }
  - assert_text: { id: pp_moves, text: "1" }
  - tap: { id: pp_resume }
  - key: { id: pp_board, key: Enter }
  - pause: { secs: 1.0 }
  - assert_text: { id: pp_moves, text: "2" }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: matchthree }
  - pause: { secs: 0.4 }
  - nav_back: {}
  - pause: { secs: 0.4 }
  - navigate: { route: matchthree }
  - tap: { id: mt_map }
  - tap: { id: 'mt_stage:1' }
  - pause: { secs: 1.0 }
  # Invalid swaps animate out and back without spending a move. Repeat after settling.
  - key: { id: mt_board, key: Home }
  - key: { id: mt_board, key: Enter }
  - key: { id: mt_board, key: ArrowRight }
  - key: { id: mt_board, key: Enter }
  - assert_text: { id: mt_status, key: mt_swap_hint, timeout_secs: 10 }
  - pause: { secs: 1.0 }
  - key: { id: mt_board, key: Home }
  - key: { id: mt_board, key: Enter }
  - key: { id: mt_board, key: ArrowRight }
  - key: { id: mt_board, key: Enter }
  - assert_text: { id: mt_status, key: mt_swap_hint, timeout_secs: 10 }
  - assert_text: { id: mt_moves, text: "22" }
  - tap: { id: mt_pause }
  - pause: { secs: 0.5 }
  - tap: { id: mt_resume }
  # Hint selects one half and places the cursor on its neighbor: Enter commits a valid move.
  - tap: { id: mt_hint }
  - key: { id: mt_board, key: Enter }
  - assert_text: { id: mt_moves, text: "21" }
  # Close during a cascade, then restore the committed game and wake again.
  - nav_back: {}
  - pause: { secs: 0.5 }
  - navigate: { route: matchthree }
  - tap: { id: mt_map }
  - tap: { id: 'mt_stage:1' }
  - pause: { secs: 1.0 }
  - tap: { id: mt_hint }
  - key: { id: mt_board, key: Enter }
  - assert_text: { id: mt_moves, text: "21" }
  - nav_back: {}
  - pause: { secs: 0.5 }
  - assert_visible: { id: home }
