# SPDX-License-Identifier: AGPL-3.0-only WITH App-Fair-Distribution-Exception
# Block Blast walkthrough (https://daybrite.dev/docs/dayscript): a fresh Normal game played from
# the keyboard, the pause menu, the difficulty picker, settings, and the rules sheet.
#
#     day launch -p macos-appkit --env DAY_GAMES_SEED=15 --script dayscript/blockblast.yaml
#
# The seed pins the deal, so four keyboard placements score 60, 100 and 110 and then clear the
# top row for 250 (games/blockblast/src/lib.rs pins every piece, start cell and score).
name: blockblast
flow:
  - wait_for: { id: home }
  - assert_visible: { id: tile_blockblast }
  # The rules open by themselves the first time the game is played; a second open skips them,
  # so the walkthrough works from any saved state (the sheet is exercised from the pause menu).
  - navigate: { route: blockblast }
  - pause: { secs: 0.8 }
  - nav_back: {}
  - pause: { secs: 0.6 }
  - navigate: { route: blockblast }
  - pause: { secs: 0.8 }
  - assert_visible: { id: bb_canvas }
  # A new Normal game, so the seeded deal is the one the unit test knows.
  - tap: { id: bb_pause }
  - pause: { secs: 0.4 }
  - assert_visible: { id: bb_pause_menu }
  - screenshot: blockblast-paused
  - tap: { id: bb_new_game }
  - pause: { secs: 0.4 }
  - assert_visible: { id: bb_difficulty_picker }
  - screenshot: blockblast-difficulty
  - tap: { id: bb_diff_normal }
  - pause: { secs: 0.8 }
  - assert_text: { id: bb_score, text: "0" }
  # A digit lifts that tray piece onto the middle of the board, the arrows move it, and the
  # same digit drops it. First the 3×2 block into the top-left corner.
  - key: { id: bb_canvas, key: "3" }
  - pause: { secs: 0.3 }
  - screenshot: blockblast-lifted
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowLeft" }
  - key: { id: bb_canvas, key: "ArrowLeft" }
  - key: { id: bb_canvas, key: "3" }
  - pause: { secs: 1.0 }
  - assert_text: { id: bb_score, text: "60" }
  # The Z beside it, then the dot; the empty tray deals three new pieces.
  - key: { id: bb_canvas, key: "1" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowRight" }
  - key: { id: bb_canvas, key: "1" }
  - pause: { secs: 0.4 }
  - key: { id: bb_canvas, key: "2" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowRight" }
  - key: { id: bb_canvas, key: "ArrowRight" }
  - key: { id: bb_canvas, key: "2" }
  - pause: { secs: 0.6 }
  # The new second piece completes the top row: the preview lights it, the drop clears it.
  - key: { id: bb_canvas, key: "2" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowUp" }
  - key: { id: bb_canvas, key: "ArrowRight" }
  - key: { id: bb_canvas, key: "ArrowRight" }
  - key: { id: bb_canvas, key: "ArrowRight" }
  - pause: { secs: 0.2 }
  - screenshot: blockblast-preview
  - key: { id: bb_canvas, key: "2" }
  - pause: { secs: 0.35 }
  - screenshot: blockblast-clear
  - pause: { secs: 1.4 }
  - assert_text: { id: bb_score, text: "250" }
  # Settings and the rules sheet from the pause menu; Done returns to it while a game is live.
  - tap: { id: bb_pause }
  - pause: { secs: 0.4 }
  - tap: { id: bb_settings }
  - pause: { secs: 0.4 }
  - assert_visible: { id: bb_settings_card }
  - tap: { id: bb_done }
  - pause: { secs: 0.3 }
  - tap: { id: bb_instructions }
  - pause: { secs: 0.4 }
  - assert_visible: { id: bb_instructions_card }
  - screenshot: blockblast-rules
  - tap: { id: bb_help_done }
  - pause: { secs: 0.3 }
  - assert_visible: { id: bb_pause_menu }
  - tap: { id: bb_resume }
  - pause: { secs: 0.3 }
  - nav_back: {}
  - pause: { secs: 0.6 }
  - assert_visible: { id: tile_blockblast }
