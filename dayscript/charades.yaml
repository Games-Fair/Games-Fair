# SPDX-License-Identifier: AGPL-3.0-only WITH App-Fair-Distribution-Exception
# Charades from the keyboard: a deck, a round answered with the arrow keys and the buttons, the
# pause menu's End Round, and the results. Answer by Tilting goes off first, so a phone or an
# emulator with a motion sensor waits for Start rather than for the phone to go up. Run with
# `--env DAY_GAMES_SEED=15`.
name: charades
flow:
  - wait_for: { id: home }
  # The rules open by themselves the first time the game is played.
  - navigate: { route: charades }
  - pause: { secs: 0.6 }
  - nav_back: {}
  - pause: { secs: 0.5 }
  - navigate: { route: charades }
  - pause: { secs: 0.6 }
  - assert_visible: { id: 'ch_deck:animals' }
  - screenshot: charades-decks
  - tap: { id: ch_settings }
  - pause: { secs: 0.4 }
  - assert_visible: { id: ch_settings_card }
  - toggle: { id: ch_tilt, value: false }
  - pause: { secs: 0.3 }
  - screenshot: charades-settings
  - tap: { id: ch_done }
  - pause: { secs: 0.4 }
  - tap: { id: 'ch_deck:animals' }
  - pause: { secs: 0.5 }
  - assert_visible: { id: ch_start }
  - screenshot: charades-ready
  - tap: { id: ch_start }
  - pause: { secs: 1.0 }
  - screenshot: charades-countdown
  - pause: { secs: 2.6 }
  - assert_visible: { id: ch_correct }
  - screenshot: charades-card
  - key: { id: ch_canvas, key: "ArrowDown" }
  - pause: { secs: 0.2 }
  - screenshot: charades-correct
  - pause: { secs: 0.8 }
  - tap: { id: ch_pass }
  - pause: { secs: 0.9 }
  - tap: { id: ch_correct }
  - pause: { secs: 0.9 }
  - tap: { id: ch_pause }
  - pause: { secs: 0.4 }
  - tap: { id: ch_end_round }
  - pause: { secs: 0.6 }
  - assert_visible: { id: ch_again }
  - assert_text: { id: ch_score, text: "2" }
  - screenshot: charades-results
  - tap: { id: ch_to_decks }
  - pause: { secs: 0.5 }
  - assert_visible: { id: 'ch_deck:animals' }
  - nav_back: {}
