#
# The Day project manifest (https://daybrite.dev/docs/cli). `name` and `version` come from
# Cargo.toml; any [app] property may be overridden per platform, toolkit, or target.
schema = 1

[app]
# The app's own id, which anyone can build and run it under. The ids the App Fair publishes
# under live in Day-appfair.toml beside this file.
id = "io.github.GamesFair"
# The URL scheme the published app registered; the id's last segment would be the default.
scheme = "fairegames"
title = "Games Fair"
# Above the 36 the stores have seen. Both order releases by version and build, and refuse one
# that repeats or lowers them.
build = 67
# The 8 shipping platform-toolkit pairs. `windows-xaml`, `linux-gtk`, and `linux-qt` build in CI
# on their native hosts; on a macOS dev box the toolkits run locally as `macos-appkit`,
# `macos-gtk`, `macos-qt`, `ios-uikit`, `android-mdc`, `harmony-arkui`, and `web-dom` (GTK/Qt are
# portable, so `macos-gtk`/`macos-qt` stand in for `linux-gtk`/`linux-qt`). `day build -p <target>`
# accepts any host-buildable target regardless of this list.
targets = [
  "windows-xaml",
  "macos-appkit",
  "linux-gtk",
  "linux-qt",
  "ios-uikit",
  "android-mdc",
  "harmony-arkui",
  "web-dom",
]

# The live listings, which the website turns into each store's localized badge
# (https://daybrite.dev/docs/store#listed-apps). The App Fair publishes this app to both stores
# under the ids in Day-appfair.toml, and these are the records it publishes to.
[store]
apple-app-id = "6761661340"
google-play-id = "org.appfair.app.Faire_Games"

# The desktop window's default size in points; phones fill the screen regardless. Tall enough
# for the Sudoku board and its keypad; the minimum keeps a game's controls reachable.
[window]
width = 720
height = 780
min_width = 480
min_height = 640

# Charades reads the accelerometer, which HarmonyOS gates behind a permission in module.json5;
# Day's portable set has no key for it (docs/permissions.md). The text HarmonyOS shows is
# `permission_ohos_permission_ACCELEROMETER` in the catalog, so it is translated.
[permissions.raw]
ohos = [{ name = "ohos.permission.ACCELEROMETER", when = "inuse" }]
