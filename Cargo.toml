# SPDX-License-Identifier: AGPL-3.0-only WITH App-Fair-Distribution-Exception
[package]
name = "games-fair"
version.workspace = true
edition = "2024"
# Generates typed `res::` constants from `resource/` (see build.rs).
build = "build.rs"

[features]
# `mock` keeps bare cargo and rust-analyzer compiling; `day build` overrides it with
# `--no-default-features --features <backend>` (https://daybrite.dev/docs/project-structure).
default = ["mock"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
qt = ["day/qt"]
uikit = ["day/uikit"]
mdc = ["day/mdc"]
xaml = ["day/xaml"]
arkui = ["day/arkui"]
dom = ["day/dom"]
mock = ["day/mock"]

# rlib for the desktop bin; the mobile pipeline requests staticlib/cdylib via `cargo rustc`.
[lib]
# A constant lib name: staged artifacts and the `dayapp::` import never move on a package rename.
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
# Track the framework's main branch. Which revision a build uses is still the committed
# Cargo.lock's; `cargo update -p day -p day-build` moves it to the tip of main.
day = { git = "https://github.com/daybrite/day.git", branch = "main", features = ["model"] }

[build-dependencies]
day-build = { git = "https://github.com/daybrite/day.git", branch = "main" }


[workspace]

[workspace.package]
version = "0.1.0"
