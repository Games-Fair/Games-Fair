# SPDX-License-Identifier: AGPL-3.0-only WITH App-Fair-Distribution-Exception
[package]
name = "games-fair"
version.workspace = true
edition = "2024"
license = "AGPL-3.0-only WITH App-Fair-Distribution-Exception"
# Generates typed resource constants (`res::images::…`, `res::assets::…`, `res::fonts::…`) from
# the files under `resource/` on every build; see build.rs and src/lib.rs.
build = "build.rs"

# One backend feature per toolkit; `day build`/`day launch` pass the real one per target
# (`--no-default-features --features <backend>`). `mock` is the default so bare `cargo` and
# rust-analyzer link.
[features]
default = ["mock"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
qt = ["day/qt"]
uikit = ["day/uikit"]
material = ["day/material"]
xaml = ["day/xaml"]
winui = ["day/winui"]
arkui = ["day/arkui"]
dom = ["day/dom"]
mock = ["day/mock"]

# rlib for the desktop bin; the mobile pipeline requests the iOS staticlib / Android cdylib
# explicitly via `cargo rustc --crate-type`.
[lib]
# A constant name, not the package's. Every artifact Day stages is named after the LIB target
# (`libdayapp.a` for the iOS/macOS staticlib, `libdayapp.so` for the Android cdylib, and the
# `dayapp::` path `src/main.rs` imports), so none of them move when the package is renamed.
# Renaming this app is a one-line edit to `[package] name` above.
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
# Day dependencies accept every stable 0.x release. Cargo.lock records the tested versions.
# Local development uses the gitignored patch table written by `day patch --local ../day`.
day = { package = "day-app", version = "0.*" }
# Settings and About (https://daybrite.dev/docs/settings): the Preferences window and menu items
# on the desktops, the cover the home grid's gear opens on the phones and the web.
day-piece-settings = "0.*"
blockblast = { path = "games/blockblast" }
breakout = { path = "games/breakout" }
charades = { path = "games/charades" }
crossword = { path = "games/crossword" }
matchthree = { path = "games/matchthree" }
mines = { path = "games/mines" }
pacpac = { path = "games/pacpac" }
flipside = { path = "games/flipside" }
pipes = { path = "games/pipes" }
gamekit = { path = "gamekit" }
sirtet = { path = "games/sirtet" }
solitaire = { path = "games/solitaire" }
sudoku = { path = "games/sudoku" }
twentyfortyeight = { path = "games/twentyfortyeight" }

[dev-dependencies]
day-core = "0.*"
# tests/records.rs reads the saves Reset all records leaves behind.
serde_json = "1"
day-mock = "0.*"
day-spec = "0.*"

[build-dependencies]
day-build = "0.*"

# Solitaire proves each new deal winnable by searching tens of thousands of positions, which an
# unoptimized build does dozens of times slower; debug builds and walkthroughs optimize that crate.
[profile.dev.package.solitaire]
opt-level = 3


[workspace]
resolver = "2"
members = [
    ".",
    "games/blockblast",
    "games/breakout",
    "games/charades",
    "games/crossword",
    "games/matchthree",
    "games/mines",
    "games/pacpac",
    "games/flipside",
    "games/pipes",
    "games/sirtet",
    "games/solitaire",
    "games/sudoku",
    "games/twentyfortyeight",
    "gamekit",
]

[workspace.package]
version = "2.5.4"
